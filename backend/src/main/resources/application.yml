spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:halistok}
    username: ${DB_USER:halistok}
    password: ${DB_PASSWORD:halistok123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Europe/Istanbul
    date-format: yyyy-MM-dd HH:mm:ss

jwt:
  secret: ${JWT_SECRET:halistok-secret-key-must-be-at-least-32-characters-long!!}
  expiration: 86400000

server:
  port: 8080

logging:
  level:
    com.halistok: INFO
